services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shelter_registry
    ports:
      - "5432:5432"
    volumes:
      - shelter_registry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shelter_registry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shelter_registry_pgdata:
